<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let a = parseInt(prompt("Enter size: "))

        for (let i = a; i >= 1; i--) {
            for (let j = 1; j <= a - i; j++) {
                document.write("&nbsp;&nbsp;");
            }

            for (let k = 1; k <= i; k++) {
                document.write("*&nbsp;&nbsp;");
            }

            document.write("<br>");
        }
    </script>
</body>

</html>
