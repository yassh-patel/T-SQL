<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Number</title>
</head>
<body>



<script>
    let num = parseInt(prompt("Enter a number:"));
    let original = num;
    let reverse = 0;

    while (num > 0) {
        let digit = num % 10;
        reverse = reverse * 10 + digit;
        num = Math.floor(num / 10);
    }

    if (original == reverse) {
        alert(original + " is a Palindrome Number");
    } else {
        alert(original + " is Not a Palindrome Number");
    }
</script>

</body>
</html>
