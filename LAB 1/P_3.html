<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Enter first number:"));
        let fac = 1

        for(let i=1;i<=num;i++){
            fac =fac*i
           
        }
         document.write(fac)
    </script>
</body>
</html>
