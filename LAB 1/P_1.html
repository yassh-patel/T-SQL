<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>

<script>
    let num1 = parseInt(prompt("Enter first number:"));
    let num2 = parseInt(prompt("Enter second number:"));
    let op = prompt("Enter operator (+, -, *, /):");

    let ans;

    if (op == "+") {
        ans = num1 + num2;
    } else if (op == "-") {
        ans = num1 - num2;
    } else if (op == "*") {
        ans = num1 * num2;
    } else if (op == "/") {
        if (num2 != 0) {
            ans = num1 / num2;
        } else {
            ans = "Cannot divide by zero";
        }
    } else {
        ans = "Invalid operator";
    }

    alert("ans = " + ans);
</script>

</body>
</html>
