<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>
<body>


<script>
    let n = parseInt(prompt("Enter the number of terms:"));

    let a = 0, b = 1, c;

    

    for (let i = 1; i <= n; i++) {
        document.write(a + " ");
        c = a + b;
        a = b;
        b = c;
    }

    document.write("Fibonacci Series:<br>");
</script>

</body>
</html>
