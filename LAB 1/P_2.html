<!DOCTYPE html>
<html>
<head>
    <title>Prime Num</title>
</head>
<body>


<script>
    let num = parseInt(prompt("Enter a number:"));
    let prime = true;

    if (num <= 1) {
        prime = false;
    } else {
        for (let i = 2; i <= num / 2; i++) {
            if (num % i == 0) {
                prime = false;
                break;
            }
        }
    }

    if (prime) {
        alert(num + " is a Prime Number");
    } else {
        alert(num + " is Not a Prime Number");
    }
</script>

</body>
</html>
