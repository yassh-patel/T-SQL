<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let a = parseInt(prompt("Enter Number1: "))
        let b = parseInt(prompt("Enter Number2: "))

        while (b != 0) {
            let temp = b
            b = a%b
            a = temp
        }

        document.write(a)

    </script>
</body>
</html>
